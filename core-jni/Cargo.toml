[package]
name = "buds-core-jni"
version = "0.1.0"
edition = "2021"
description = "The JNI bridge that lets the Android app run the buds-core drivers."
license = "GPL-3.0-or-later"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
buds-core = { path = "../core" }
jni = "0.21.1"
serde_json = "1"

# A panic in the core must not end the app: unwind, so each JNI call can catch it.
[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
panic = "unwind"
